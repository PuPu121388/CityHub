# RocketMQ Broker 配置
# 由 docker-compose.yml 挂载进容器，覆盖默认配置。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：Broker 注册到 NameServer 的地址。
# 容器内默认是内网 IP（如 172.x.x.x），宿主机的 Spring Boot 连不上，
# 必须显式写 127.0.0.1，配合 docker-compose 的 10911 端口映射才能连通。
brokerIP1 = 127.0.0.1

# 开发环境允许自动建 Topic，省去手动创建的步骤
autoCreateTopicEnable = true
